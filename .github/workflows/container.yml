name: build container

# Builds the Boltz-2 image and publishes it to GitHub Container Registry.
# GitHub does the building, so you need neither root on Fox nor Docker on
# your Mac.
#
# Triggers:
#   - pushing a tag like v1, v2 ...  (the normal route: a tagged release
#     is what you cite in the methods section)
#   - the "Run workflow" button on the Actions tab (for testing)
#
# After a successful run, on Fox:
#   apptainer pull boltz.sif docker://ghcr.io/<owner>/<repo>/boltz:v1
#
# The package is private by default. Make it public, or authenticate on Fox
# with a personal access token, before pulling.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # CUDA plus PyTorch is a large image and the default runner disk is
      # tight. This frees roughly 20 GB that the runner does not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tag and image name
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi
          # GHCR requires lowercase image names, while repository names may
          # contain capitals. Without this the push fails with
          # "repository name must be lowercase".
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
              >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./container
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/boltz:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/boltz:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Say how to pull it
        run: |
          IMAGE="ghcr.io/${{ steps.meta.outputs.repo }}/boltz:${{ steps.meta.outputs.tag }}"
          echo "On Fox:"
          echo "  apptainer pull \$HOME/images/boltz.sif docker://$IMAGE"
          echo
          echo "Record this in the logbook:"
          echo "  image  $IMAGE"
          echo "  commit ${{ github.sha }}"
